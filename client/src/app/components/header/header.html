<header class="app-header">
  <div class="header-inner">

    <!-- Brand -->
    <a routerLink="/" class="brand">
      <div class="brand-icon">
        L
      </div>

      <div class="brand-text">
        <span class="brand-name">LifeVault</span>
        <span class="brand-tagline">AI-Powered Personal Vault</span>
      </div>
    </a>


    @if (authService.islogedIn()) {

      <!-- Authenticated Navigation -->
      <nav class="main-nav">

        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Dashboard
        </a>

        <a
          routerLink="/vault"
          routerLinkActive="active"
        >
          My Vault
        </a>

        <a
          routerLink="/ai"
          routerLinkActive="active"
        >
          <span class="ai-icon">✦</span>
          AI Assistant
        </a>

      </nav>


      <!-- Authenticated Actions -->
      <div class="header-actions">

        <button
          class="ai-button"
          routerLink="/ai"
        >
          <span>✦</span>
          Ask AI
        </button>

        <div class="divider"></div>

        <div class="profile">

          <button
            type="button"
            class="profile-button"
            [class.open]="menuOpen()"
            aria-haspopup="menu"
            [attr.aria-expanded]="menuOpen()"
            (click)="toggleMenu()"
          >

            <div class="avatar">
              {{ initials() }}
            </div>

            <div class="profile-info">
              <span class="profile-name">
                {{ displayName() }}
              </span>

              <span class="profile-role">
                Personal Vault
              </span>
            </div>

            <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M5 7.5l5 5 5-5" />
            </svg>

          </button>

          @if (menuOpen()) {

            <div class="profile-menu" role="menu">

              <div class="menu-header">
                <div class="avatar avatar-lg">
                  {{ initials() }}
                </div>

                <div class="menu-user">
                  <span class="menu-name">{{ displayName() }}</span>
                  <span class="menu-status">
                    <span class="status-dot"></span>
                    Signed in
                  </span>
                </div>
              </div>

              <div class="menu-divider"></div>

              <a routerLink="/" class="menu-item" role="menuitem" (click)="closeMenu()">
                Upload receipt
              </a>

              <a routerLink="/vault" class="menu-item" role="menuitem" (click)="closeMenu()">
                My Vault
              </a>

              <a routerLink="/ai" class="menu-item" role="menuitem" (click)="closeMenu()">
                AI Assistant
              </a>

              <div class="menu-divider"></div>

              <button
                type="button"
                class="menu-item menu-logout"
                role="menuitem"
                (click)="logout()"
              >
                Log out
              </button>

            </div>

          }

        </div>

      </div>

    } @else {

      <!-- Guest Actions -->
      <div class="header-actions guest-actions">

        <a
          routerLink="/login"
          class="login-button"
        >
          Login
        </a>

        <a
          routerLink="/signup"
          class="signup-button"
        >
          Sign Up
        </a>

      </div>

    }

  </div>
</header>
